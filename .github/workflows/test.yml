# The solution built (warnings are errors) and every test run on macOS (arm64), Windows and Linux (Ubuntu LTS, x64),
# each system's tests split across shards that run at once, the results in artifacts/test-results. Every restore is
# locked to the packages.lock.json files. Actions are pinned to a release's commit.
name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Avalonia's build task sends usage data from every build unless this is in the environment.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  # One shard of a system's tests, on a runner of its own. Each builds the solution itself, two minutes beside the
  # others, rather than all waiting on one build's 2 GB uploaded once and downloaded by each. Each lists the whole suite
  # and deals its classes to the system's shards by their seconds there (TestTimes.json), the same deal in every shard
  # of a commit, and runs its own hand.
  shard:
    name: ${{ matrix.name }}, shard ${{ matrix.shard }} of ${{ matrix.shards }}
    strategy:
      # One shard's failure never hides another's result.
      fail-fast: false
      matrix:
        system: [macOS, Windows, Linux]
        # A system's number of shards is its `shards` below, and these numbers up to it (a system with fewer excludes
        # its others). With four, about 13 to 15 minutes of tests each; GitHub runs five macOS jobs at once, the fifth
        # CI's disk image.
        shard: [1, 2, 3, 4]
        # time_scale multiplies every test's wall-clock limit (PASSENGER_TEST_TIME_SCALE), each written as the Mac's
        # time: to the nearest half, the 90th percentile of how much longer a test of a second or more took on the
        # system's runner (in October, macOS 2.23, Windows 2.64, Linux 1.96).
        include:
          - system: macOS
            name: macOS (arm64)
            os: macos-latest
            shards: 4
            time_scale: 2
          - system: Windows
            name: Windows (x64)
            os: windows-latest
            shards: 4
            time_scale: 2.5
          - system: Linux
            name: Linux (x64)
            os: ubuntu-26.04
            shards: 4
            time_scale: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 56
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The SDK global.json names exactly (a release candidate), and .NET 10 for the debuggees and the tests' projects.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # The runner's .NET is in ~/.dotnet, not where the macOS installer puts it: registered, so the IDE started with
      # launchd's bare environment finds its runtime.
      - name: Register .NET's install location
        if: runner.os == 'macOS'
        run: sudo mkdir -p /etc/dotnet && echo "$DOTNET_ROOT" | sudo tee /etc/dotnet/install_location

      # createdump (a memory snapshot) reads its program as a debugger does, for which macOS asks a member of _developer
      # for a password that no one on a runner answers: the runner joins _developer, and the right asks its members
      # nothing. The state before is printed, for a hang that remains.
      - name: Let debugging tools read the runner's processes
        if: runner.os == 'macOS'
        run: |
          DevToolsSecurity -status
          id -Gn
          security authorizationdb read system.privilege.taskport | plutil -p -
          sudo dseditgroup -o edit -a "$USER" -t user _developer
          sudo dscacheutil -flushcache
          sudo security authorizationdb write system.privilege.taskport is-developer

      # The libraries a person installs (site/linux.html): Git, the window's X11 libraries, and fontconfig, which Skia
      # draws the headless tests' text with too.
      - name: The libraries Passenger needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git libx11-6 libice6 libsm6 libfontconfig1

      - name: Restore cached NuGet packages
        id: nuget
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      # Only what the lock files name, each package's content hash checked against them.
      - name: Restore
        run: dotnet restore --locked-mode

      # Saved once restored, so a failing build or test still leaves the next run its packages; by one shard of each
      # system, since the others would only find the key taken.
      - name: Cache NuGet packages
        if: matrix.shard == 1 && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}

      - name: Build
        run: dotnet build --no-restore

      # Only Linux's runner runs Linux containers. The images the container tests run on (ContainerImages.txt; Docker
      # Hub limits pulls) come from a cache, pulled only when it lacks them, so no test pulls one.
      - name: Restore cached container images
        id: images
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-images.tar
          key: container-images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Passenger.Tests/ContainerImages.txt') }}

      # A pull that fails is a warning, not the shard's failure: the container tests skip, saying which image is missing.
      - name: The container images the tests run on
        id: pulled
        if: runner.os == 'Linux'
        env:
          IMAGES: ${{ runner.temp }}/container-images.tar
        run: |
          if [ -f "$IMAGES" ] && ! docker load -q -i "$IMAGES"; then
            echo "::warning title=Container images::The cached images did not load, so they are pulled"
            rm -f "$IMAGES"
          fi
          images=$(grep -v '^[[:space:]]*$' tests/Passenger.Tests/ContainerImages.txt)
          missing=
          for image in $images; do
            docker image inspect "$image" > /dev/null 2>&1 && continue
            docker pull -q "$image" || { echo "::warning title=Container image::$image could not be pulled, so the container tests skip"; missing=1; }
          done
          if [ -z "$missing" ] && [ ! -f "$IMAGES" ]; then
            docker save -o "$IMAGES" $images
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
          echo "PASSENGER_TEST_PULL=never" >> "$GITHUB_ENV"

      - name: Cache container images
        if: runner.os == 'Linux' && matrix.shard == 1 && steps.images.outputs.cache-hit != 'true' && steps.pulled.outputs.saved == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-images.tar
          key: ${{ steps.images.outputs.cache-primary-key }}

      # A file the .gitignore matches never reaches a clone. After the build, so one that wrote beside the sources
      # shows too; and no tracked file may match a rule, since its folder's other files would not be seen.
      - name: No source is ignored by Git
        if: matrix.shard == 1
        run: |
          hidden=$(git ls-files --others --ignored --exclude-standard -- src tests tools site
                   git ls-files --cached --ignored --exclude-standard)
          if [ -n "$hidden" ]; then
            echo "::error title=Ignored sources::The .gitignore matches these, so a clone would not have them or their neighbours"
            echo "$hidden"
            exit 1
          fi

      # The deal goes in the log. Before any test runs, the first shard alone lists what each shard's settings select
      # and fails unless every test is in exactly one (every shard deals the same, and each listing costs a VSTest
      # start). The suite's listing and the shards' settings go with the results, for the summary to check them against
      # and a person to read. A listing that names no test or says discovery failed (xunit #3576) is asked again, up to
      # three tries.
      - name: Deal the tests to the shards
        env:
          SYSTEM: ${{ matrix.system }}
          SHARDS: ${{ matrix.shards }}
          SHARD: ${{ matrix.shard }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          results=artifacts/test-results
          mkdir -p "$results/shards"
          "$python" -I tools/test-shards.py list "$results/suite.txt"
          "$python" -I tools/test-shards.py split "$results/suite.txt" --system "$SYSTEM" --of "$SHARDS" --out "$results/shards"
          [ "$SHARD" = 1 ] || exit 0
          for number in $(seq 1 "$SHARDS"); do
            "$python" -I tools/test-shards.py list "$results/shards/listed-$number.txt" \
              --settings "$results/shards/shard-$number.runsettings"
          done
          "$python" -I tools/test-shards.py check "$results/suite.txt" "$results"/shards/listed-*.txt

      # A test hung for 10 minutes is stopped and named, rather than holding the job to its timeout. Each class's time
      # goes in the job's summary, a class over its budget a warning and a shard over TestBudget.json's minutes a
      # failure; the step's timeout is above that budget, so a slow shard still leaves its table. The failed tests are
      # listed last, as annotations and in the job's summary.
      - name: Test
        shell: pwsh
        timeout-minutes: 38
        env:
          SHARD: ${{ matrix.shard }}
          LABEL: ${{ matrix.name }}, shard ${{ matrix.shard }} of ${{ matrix.shards }}
          PASSENGER_TEST_TIME_SCALE: ${{ matrix.time_scale }}
        run: |
          $results = 'artifacts/test-results'
          dotnet test tests/Passenger.Tests --no-build --settings "$results/shards/shard-$env:SHARD.runsettings" `
            --results-directory $results --logger trx --logger "console;verbosity=normal" `
            --blame-hang-timeout 10m --blame-hang-dump-type none
          $code = $LASTEXITCODE
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -I tools/test-times.py $results --budget tests/Passenger.Tests/TestBudget.json --shard $env:SHARD --label $env:LABEL
          $budget = $LASTEXITCODE
          if ($code -eq 0) { exit $budget }
          $failed = @(Get-ChildItem $results -Recurse -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object {
            ([xml](Get-Content -Raw $_.FullName)).TestRun.Results.UnitTestResult |
              Where-Object { $_ -and $_.outcome -notin 'Passed', 'NotExecuted' }
          })
          # The workflow command's own escapes: % and line breaks in a message, and : and , in a property too.
          function Escape([string] $text, [switch] $property) {
            $text = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            if ($property) { $text = $text.Replace(':', '%3A').Replace(',', '%2C') }
            $text
          }
          $heading = "Tests failed on ${env:LABEL}: $($failed.Count)"
          if ($failed.Count -eq 0) {
            $heading = "dotnet test failed on ${env:LABEL} with no failed test in its results: the log above says what crashed or hung"
          }
          $summary = @("### $heading", '')
          Write-Host "`n$heading"
          foreach ($test in $failed) {
            $message = "$($test.Output.ErrorInfo.Message)".Trim()
            Write-Host "  $($test.testName) ($($test.outcome))"
            Write-Host "::error title=$(Escape $test.testName -property)::$(Escape $message)"
            $summary += "- ``$($test.testName)`` ($($test.outcome)): $(($message -split "`n")[0].Trim())"
          }
          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit $code

      # Which shard this was and how its job ended, beside its results: the summary job's to read.
      - name: Say how the shard ended
        if: ${{ !cancelled() }}
        env:
          SYSTEM: ${{ matrix.system }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts/test-results
          printf '{"system": "%s", "shard": %s, "shards": %s, "status": "%s"}\n' "$SYSTEM" "$SHARD" "$SHARDS" "$STATUS" \
            > artifacts/test-results/shard.json

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.system }}-${{ matrix.shard }}
          path: artifacts/test-results/

  # Each system's result as one check: every shard's job succeeded and every test has exactly one result among them,
  # each class's time in the summary, and a warning when dealing by this run's times would end the slowest shard two
  # minutes sooner (`just test-times RUN` writes them, for a person to commit). It waits for every system's shards, as
  # one matrix job's needs must.
  summary:
    name: ${{ matrix.name }}
    needs: shard
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: macOS
            name: macOS (arm64)
          - system: Windows
            name: Windows (x64)
          - system: Linux
            name: Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            tests/Passenger.Tests

      # Each shard's artifact in a folder of its own, or, when only one shard left any, in results itself.
      - name: Download the shards' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-${{ matrix.system }}-*
          path: results

      - name: Test times
        env:
          NAME: ${{ matrix.name }}
        run: |
          if [ -n "$(find results -name '*.trx' 2> /dev/null)" ]; then
            python3 -I tools/test-times.py results --budget tests/Passenger.Tests/TestBudget.json --summary --label "$NAME"
          fi

      - name: Every test ran in exactly one shard
        if: ${{ !cancelled() }}
        env:
          SYSTEM: ${{ matrix.system }}
        run: python3 -I tools/test-shards.py cover results --system "$SYSTEM"
