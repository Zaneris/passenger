# The solution built (warnings are errors) and its tests run on macOS (arm64), Windows and Linux (Ubuntu LTS, x64) in
# two lanes: the gate (the [Gate] tests and the unit tests), whose failure fails the caller, and, when the caller asks,
# the report lane (every other test, its classes marked [SameOnEverySystem] on Linux alone), whose failures are listed for
# triage and fail nothing. Each lane's tests are split across shards that run at once, the report lane's last ones in the
# gate's jobs once their gate tests end, and each job runs its tests in several processes at once, the
# results in artifacts/test-results. Every restore is locked to the packages.lock.json files. Actions are pinned to a
# release's commit.
name: Test

on:
  workflow_call:
    inputs:
      report:
        description: Whether the report lane runs too, beside the gate
        type: boolean
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Avalonia's build task sends usage data from every build unless this is in the environment.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  # One shard of a lane of a system's tests, on a runner of its own. Each builds the solution itself, two minutes beside
  # the others, rather than all waiting on one build's 2 GB uploaded once and downloaded by each. Each lists both lanes
  # and deals its lane's classes to the lane's shards on the system by their seconds there (TestTimes.json), the same
  # deal in every shard of a commit, and runs its own hand; a gate job, when the report lane runs, then runs one of the
  # report lane's shards too. A report shard's failure is said and fails nothing, in a gate job too.
  shard:
    name: ${{ matrix.lane == 'gate' && 'Gate' || 'Report' }}, ${{ matrix.name }}, shard ${{ matrix.shard }} of ${{ matrix.lane == 'gate' && matrix.gate_shards || matrix.report_shards }}
    continue-on-error: ${{ matrix.lane == 'report' }}
    strategy:
      # One shard's failure never hides another's result.
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.report && '["gate", "report"]' || '["gate"]') }}
        system: [macOS, Windows, Linux]
        # The layout, every system's: the gate's shards are its jobs of the numbers below up to gate_shards (the exclude
        # drops the other), and the report lane's, report_shards in all, are its own jobs of these numbers and then one
        # in each gate job once its gate tests end. Five test jobs a system, as GitHub runs five macOS jobs at once: there
        # one waits out the debug relay's minute, and the disk images wait for a test job to end.
        gate_shards: [2]
        report_shards: [5]
        shard: [1, 2, 3]
        exclude:
          - lane: gate
            shard: 3
        # time_scale multiplies every test's wall-clock limit (PASSENGER_TEST_TIME_SCALE), each written as the Mac's
        # time: to the nearest half, the 90th percentile of how much longer a test of a second or more took on the
        # system's runner (in October, macOS 2.23, Windows 2.64, Linux 1.96). processes is how many test processes a
        # job runs its window and Beside classes in at once, its Alone classes after them in one: two on macOS's runner
        # of three processors and 7 GB, where two kept at least 1.4 GB free and ended no process, and on Linux's, whose
        # jobs end well within the others'; three on Windows', of four processors and 16 GB, where two ran each class
        # only 7% slower than one alone and left 7 GB free.
        include:
          - system: macOS
            name: macOS (arm64)
            os: macos-latest
            time_scale: 2
            processes: 2
          - system: Windows
            name: Windows (x64)
            os: windows-latest
            time_scale: 2.5
            processes: 3
          - system: Linux
            name: Linux (x64)
            os: ubuntu-26.04
            time_scale: 2
            processes: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    env:
      LANE: ${{ matrix.lane }}
      SHARDS: ${{ matrix.lane == 'gate' && matrix.gate_shards || matrix.report_shards }}
      LABEL: ${{ matrix.lane == 'gate' && 'Gate' || 'Report' }}, ${{ matrix.name }}, shard ${{ matrix.shard }} of ${{ matrix.lane == 'gate' && matrix.gate_shards || matrix.report_shards }}
      # The job's tests' time, whichever lanes they are of.
      TEST_MINUTES: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The SDK global.json names exactly, and .NET 10 for the debuggees and the tests' projects.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # macOS's runners of one label come as more than one machine (7 GB and 14 GB of memory, a job's tests taking a third
      # longer on the smaller), which the log names, so a job's time is read against the machine it had.
      - name: The runner's machine
        if: runner.os == 'macOS'
        run: sysctl hw.model machdep.cpu.brand_string hw.ncpu hw.memsize

      # The runner's .NET is in ~/.dotnet, not where the macOS installer puts it: registered, so the IDE started with
      # launchd's bare environment finds its runtime.
      - name: Register .NET's install location
        if: runner.os == 'macOS'
        run: sudo mkdir -p /etc/dotnet && echo "$DOTNET_ROOT" | sudo tee /etc/dotnet/install_location

      # createdump (a memory snapshot) reads its program as a debugger does, for which macOS asks a member of _developer
      # for a password that no one on a runner answers: the runner joins _developer, and the right asks its members
      # nothing. The state before is printed, for a hang that remains.
      - name: Let debugging tools read the runner's processes
        if: runner.os == 'macOS'
        run: |
          DevToolsSecurity -status
          id -Gn
          security authorizationdb read system.privilege.taskport | plutil -p -
          sudo dseditgroup -o edit -a "$USER" -t user _developer
          sudo dscacheutil -flushcache
          sudo security authorizationdb write system.privilege.taskport is-developer

      # The libraries a person installs (site/linux.html): Git, the window's X11 libraries, and fontconfig, which Skia
      # draws the headless tests' text with too.
      - name: The libraries Passenger needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git libx11-6 libice6 libsm6 libfontconfig1

      # The Vim that VimTests compares Vim mode with (tools/vim.sh), built from its release where the cache lacks it,
      # which the gate's first shard then fills; elsewhere its test skips, saying so.
      - name: Restore the tests' Vim
        if: runner.os == 'Linux'
        id: vim
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/vim
          key: vim-${{ hashFiles('tools/vim.sh') }}-${{ matrix.os }}-${{ runner.arch }}

      - name: Build the tests' Vim
        if: runner.os == 'Linux' && steps.vim.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libncurses-dev
          tools/vim.sh

      - name: Cache the tests' Vim
        if: runner.os == 'Linux' && matrix.lane == 'gate' && matrix.shard == 1 && steps.vim.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/vim
          key: ${{ steps.vim.outputs.cache-primary-key }}

      - name: Restore cached NuGet packages
        id: nuget
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      # Only what the lock files name, each package's content hash checked against them.
      - name: Restore
        run: dotnet restore --locked-mode

      # Saved once restored, so a failing build or test still leaves the next run its packages; by the gate's first
      # shard of each system, which every run has, since the others would only find the key taken.
      - name: Cache NuGet packages
        if: matrix.lane == 'gate' && matrix.shard == 1 && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}

      # The build's check, every analyzer and code-style rule with warnings as errors, is the gate's first shard's on each
      # system, which every run has; the others build the same code without running the analyzers (generators still
      # run), which change nothing that is built and take about half the build's time. Both deals give that job's
      # shards the less to run for the minutes the check takes (--checks-first).
      - name: Build
        env:
          CHECKS: ${{ matrix.lane == 'gate' && matrix.shard == 1 }}
        run: |
          if [ "$CHECKS" = true ]; then
            dotnet build --no-restore
          else
            dotnet build --no-restore -p:RunAnalyzers=false
          fi

      # Only Linux's runner runs Linux containers. The images the container tests run on (ContainerImages.txt; Docker
      # Hub limits pulls) come from a cache, pulled only when it lacks them, so no test pulls one.
      - name: Restore cached container images
        id: images
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-images.tar
          key: container-images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Passenger.Tests/ContainerImages.txt') }}

      # A pull that fails is a warning, not the shard's failure: the container tests skip, saying which image is missing.
      - name: The container images the tests run on
        id: pulled
        if: runner.os == 'Linux'
        env:
          IMAGES: ${{ runner.temp }}/container-images.tar
        run: |
          if [ -f "$IMAGES" ] && ! docker load -q -i "$IMAGES"; then
            echo "::warning title=Container images::The cached images did not load, so they are pulled"
            rm -f "$IMAGES"
          fi
          images=$(grep -v '^[[:space:]]*$' tests/Passenger.Tests/ContainerImages.txt)
          missing=
          for image in $images; do
            docker image inspect "$image" > /dev/null 2>&1 && continue
            docker pull -q "$image" || { echo "::warning title=Container image::$image could not be pulled, so the container tests skip"; missing=1; }
          done
          if [ -z "$missing" ] && [ ! -f "$IMAGES" ]; then
            docker save -o "$IMAGES" $images
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
          echo "PASSENGER_TEST_PULL=never" >> "$GITHUB_ENV"

      - name: Cache container images
        if: runner.os == 'Linux' && matrix.lane == 'gate' && matrix.shard == 1 && steps.images.outputs.cache-hit != 'true' && steps.pulled.outputs.saved == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-images.tar
          key: ${{ steps.images.outputs.cache-primary-key }}

      # A file the .gitignore matches never reaches a clone. After the build, so one that wrote beside the sources
      # shows too; and no tracked file may match a rule, since its folder's other files would not be seen.
      - name: No source is ignored by Git
        if: matrix.lane == 'gate' && matrix.shard == 1
        run: |
          hidden=$(git ls-files --others --ignored --exclude-standard -- src tests tools site
                   git ls-files --cached --ignored --exclude-standard)
          if [ -n "$hidden" ]; then
            echo "::error title=Ignored sources::The .gitignore matches these, so a clone would not have them or their neighbours"
            echo "$hidden"
            exit 1
          fi

      # Both lanes, which together are the system's whole suite (whole.txt), as each lane's deal reads both: a class with
      # tests outside its lane is weighed by its share of them, and the report lane's shards in the gate's jobs begin as
      # the gate's tests end. The report lane's classes marked [SameOnEverySystem] are listed on Linux alone. A listing
      # that names no test or says discovery failed (xunit #3576) is asked again, up to three tries. The step fails where
      # both lanes together list more tests than the suite may (test-shards.py's MOST_TESTS).
      - name: List the tests
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          lists=artifacts/test-lists
          mkdir -p "$lists"
          "$python" -I tools/test-shards.py list "$lists/gate.txt" --lane gate --system "$SYSTEM"
          "$python" -I tools/test-shards.py list "$lists/report.txt" --lane report --system "$SYSTEM" \
            --beside "$lists/gate.txt"
          cat "$lists/gate.txt" "$lists/report.txt" > "$lists/whole.txt"

      # The deal goes in the log. Before any test runs, the lane's first shard alone lists what each shard's settings
      # select and fails unless every test of the lane is in exactly one (each listing costs a VSTest start). The
      # listings and the shards' settings go with the results, for the summary and `just test-times` to read.
      - name: Deal the gate's tests to its shards
        if: matrix.lane == 'gate'
        env:
          SYSTEM: ${{ matrix.system }}
          SHARD: ${{ matrix.shard }}
          PROCESSES: ${{ matrix.processes }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          results=artifacts/test-results
          mkdir -p "$results/shards"
          cp artifacts/test-lists/gate.txt "$results/suite.txt"
          cp artifacts/test-lists/whole.txt "$results/whole.txt"
          check=
          [ "$SHARD" != 1 ] || check=--check
          "$python" -I tools/test-shards.py split "$results/suite.txt" --lane gate --whole "$results/whole.txt" \
            --system "$SYSTEM" --of "$SHARDS" --processes "$PROCESSES" --checks-first --out "$results/shards" $check

      # The same for the report lane, whose last shards run each in a gate job once its gate tests end (as the gate's deal
      # has them end), numbered after the report jobs' own. Nothing of it fails a gate job.
      - name: Deal the report lane's tests to its shards
        id: report-deal
        if: inputs.report
        continue-on-error: ${{ matrix.lane == 'gate' }}
        env:
          SYSTEM: ${{ matrix.system }}
          NAME: ${{ matrix.name }}
          SHARD: ${{ matrix.shard }}
          GATE_SHARDS: ${{ matrix.gate_shards }}
          REPORT_SHARDS: ${{ matrix.report_shards }}
          PROCESSES: ${{ matrix.processes }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          results=artifacts/test-results
          number=$SHARD
          if [ "$LANE" = gate ]; then
            results=artifacts/report-results
            number=$((REPORT_SHARDS - GATE_SHARDS + SHARD))
          fi
          mkdir -p "$results/shards"
          cp artifacts/test-lists/report.txt "$results/suite.txt"
          cp artifacts/test-lists/whole.txt "$results/whole.txt"
          check=
          [ "$number" != 1 ] || check=--check
          "$python" -I tools/test-shards.py split "$results/suite.txt" --lane report --whole "$results/whole.txt" \
            --system "$SYSTEM" --of "$REPORT_SHARDS" --after artifacts/test-lists/gate.txt --after-of "$GATE_SHARDS" \
            --processes "$PROCESSES" --checks-first --out "$results/shards" $check
          [ "$LANE" = gate ] || exit 0
          echo "shard=$number" >> "$GITHUB_OUTPUT"
          echo "label=Report, $NAME, shard $number of $REPORT_SHARDS, after the gate's shard $SHARD" >> "$GITHUB_OUTPUT"

      # A job's tests have TEST_MINUTES in all: a gate job's report shard has what its gate tests left.
      - name: Start the clock on the job's tests
        if: matrix.lane == 'gate' && steps.report-deal.outcome == 'success'
        run: echo "TESTS_BEGAN=$(date +%s)" >> "$GITHUB_ENV"

      # The hand's runs of dotnet test as the deal wrote them (with several processes, the window and Beside classes in
      # them at once, then the Alone classes in one), what each prints kept beside the results as it comes, so a shard stopped
      # partway leaves what it ran. A test hung for 10 minutes is stopped and named, rather than holding the job to its
      # timeout. Each class's time and how low the free memory fell go in the job's summary; the failed tests are listed
      # last, as annotations (warnings in the report lane) and in the job's summary.
      - name: Test
        shell: pwsh
        timeout-minutes: ${{ fromJSON(env.TEST_MINUTES) }}
        continue-on-error: ${{ matrix.lane == 'report' }}
        env:
          RESULTS: artifacts/test-results
          SHARD: ${{ matrix.shard }}
          PASSENGER_TEST_TIME_SCALE: ${{ matrix.time_scale }}
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -I tools/test-shards.py test $env:RESULTS --shard $env:SHARD --lane $env:LANE --label $env:LABEL
          exit $LASTEXITCODE

      # Which shard this was and how its job ended, beside its results, for the summary jobs; and the classes of its hand
      # it did not run whole (its Test step ran out of time, or a test host ended), each a line "  Unreached CLASS" in the
      # log, in the job's summary and in unreached.txt.
      - name: Say how the shard ended
        if: ${{ !cancelled() }}
        env:
          RESULTS: artifacts/test-results
          SYSTEM: ${{ matrix.system }}
          SHARD: ${{ matrix.shard }}
          STATUS: ${{ job.status }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          "$python" -I tools/test-shards.py ended "$RESULTS" --system "$SYSTEM" --lane "$LANE" --shard "$SHARD" \
            --of "$SHARDS" --status "$STATUS" --label "$LABEL"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.system }}-${{ matrix.lane }}-${{ matrix.shard }}
          path: artifacts/test-results/

      # A gate job's report shard, once the gate's results are kept, whether its gate tests passed or not, in the minutes
      # they left: as in a report job, its failed tests are warnings and its results the report lane's, and nothing of it
      # fails the job, whose verdict is the gate's alone.
      - name: The report shard's minutes
        id: minutes
        if: ${{ !cancelled() && matrix.lane == 'gate' && steps.report-deal.outcome == 'success' }}
        continue-on-error: true
        run: echo "left=$(( TEST_MINUTES - ($(date +%s) - TESTS_BEGAN + 59) / 60 ))" >> "$GITHUB_OUTPUT"

      - name: Test the report shard
        id: report-test
        if: ${{ !cancelled() && matrix.lane == 'gate' && fromJSON(steps.minutes.outputs.left || '0') > 0 }}
        shell: pwsh
        timeout-minutes: ${{ fromJSON(steps.minutes.outputs.left || '1') }}
        continue-on-error: true
        env:
          RESULTS: artifacts/report-results
          LANE: report
          SHARD: ${{ steps.report-deal.outputs.shard }}
          LABEL: ${{ steps.report-deal.outputs.label }}
          PASSENGER_TEST_TIME_SCALE: ${{ matrix.time_scale }}
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -I tools/test-shards.py test $env:RESULTS --shard $env:SHARD --lane $env:LANE --label $env:LABEL
          exit $LASTEXITCODE

      # Its status is its Test step's conclusion, as a report job's is its job's: success however its tests went or ran
      # out of time, skipped when its gate tests left it no minute.
      - name: Say how the report shard ended
        if: ${{ !cancelled() && matrix.lane == 'gate' && steps.report-deal.outcome == 'success' }}
        continue-on-error: true
        env:
          RESULTS: artifacts/report-results
          SYSTEM: ${{ matrix.system }}
          LANE: report
          SHARD: ${{ steps.report-deal.outputs.shard }}
          SHARDS: ${{ matrix.report_shards }}
          LABEL: ${{ steps.report-deal.outputs.label }}
          STATUS: ${{ steps.report-test.conclusion }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          "$python" -I tools/test-shards.py ended "$RESULTS" --system "$SYSTEM" --lane "$LANE" --shard "$SHARD" \
            --of "$SHARDS" --status "$STATUS" --label "$LABEL"

      - name: Upload the report shard's results
        if: ${{ !cancelled() && matrix.lane == 'gate' && steps.report-deal.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.system }}-report-${{ steps.report-deal.outputs.shard }}
          path: artifacts/report-results/

  # Each lane's result on each system as one check: every shard's job succeeded and every test of the lane has exactly
  # one result among them, each class's time in the summary, and a warning when dealing by this run's times would end
  # the slowest shard two minutes sooner (`just test-times RUN` writes them, for a person to commit). The report lane's
  # only warns. It waits for every shard, as one matrix job's needs must.
  summary:
    name: ${{ matrix.lane == 'gate' && 'Gate' || 'Report' }}, ${{ matrix.name }}
    needs: shard
    if: ${{ !cancelled() }}
    continue-on-error: ${{ matrix.lane == 'report' }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.report && '["gate", "report"]' || '["gate"]') }}
        system: [macOS, Windows, Linux]
        include:
          - system: macOS
            name: macOS (arm64)
          - system: Windows
            name: Windows (x64)
          - system: Linux
            name: Linux (x64)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            tests/Passenger.Tests

      # Each shard's artifact in a folder of its own, or, when only one shard left any, in results itself.
      - name: Download the shards' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-${{ matrix.system }}-${{ matrix.lane }}-*
          path: results

      - name: Test times
        env:
          NAME: ${{ matrix.name }}, the ${{ matrix.lane }} lane
        run: |
          if [ -n "$(find results -name '*.trx' 2> /dev/null)" ]; then
            python3 -I tools/test-times.py results --label "$NAME"
          fi

      - name: Every test ran in exactly one shard
        if: ${{ !cancelled() }}
        env:
          SYSTEM: ${{ matrix.system }}
          LANE: ${{ matrix.lane }}
        run: python3 -I tools/test-shards.py cover results --system "$SYSTEM" --lane "$LANE"

  # The report lane's failed tests on every system in one table, its shards in the gate's jobs too, each with its system
  # and the first line of what it said, to be filed and fixed in the usual way: nothing here fails the run.
  failures:
    name: Report's failed tests
    needs: shard
    if: ${{ inputs.report && !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools

      - name: Download the report shards' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*-report-*
          path: results

      - name: The failed tests
        run: python3 -I tools/test-shards.py failures results --title "The report lane's failed tests"
