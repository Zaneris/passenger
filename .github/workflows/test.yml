# The solution built (warnings are errors) and its tests run on macOS (arm64), Windows and Linux (Ubuntu LTS, x64) in
# two lanes: the gate (the [Gate] tests and the unit tests), whose failure fails the caller, and, when the caller asks,
# the report lane (every other test, its classes marked [SameOnEverySystem] on Linux alone, and on macOS only its
# classes marked [AboutMacOS]), whose failures are listed for triage and fail nothing. Each lane's tests are split
# across shards that run at once, the report lane's last ones in the gate's jobs once their gate tests end, and each job
# runs its tests in several processes at once, the results in artifacts/test-results. Every restore is locked to the
# packages.lock.json files. Actions are pinned to a release's commit.
name: Test

on:
  workflow_call:
    inputs:
      report:
        description: Whether the report lane runs too, beside the gate
        type: boolean
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Avalonia's build task sends usage data from every build unless this is in the environment.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  # One shard of a lane of a system's tests, on a runner of its own. Each builds the solution itself, two minutes beside
  # the others, rather than all waiting on one build's 2 GB uploaded once and downloaded by each. Each lists both lanes
  # and deals its lane's classes to the lane's shards on the system by their seconds in the lane there (TestTimes.json),
  # the same deal in every shard of a commit, and runs its own hand; a gate job, when the report lane runs, then runs one
  # of the report lane's shards too. A report shard's failure is said and fails nothing, in a gate job too.
  shard:
    name: ${{ matrix.lane == 'gate' && 'Gate' || 'Report' }}, ${{ matrix.name }}, shard ${{ matrix.shard }} of ${{ matrix.lane == 'gate' && matrix.gate_shards || matrix.report_shards }}
    continue-on-error: ${{ matrix.lane == 'report' }}
    strategy:
      # One shard's failure never hides another's result.
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.report && '["gate", "report"]' || '["gate"]') }}
        system: [macOS, Windows, Linux]
        # The layout, every system's: the gate's shards are its jobs of the numbers below up to gate_shards (the exclude
        # drops the other), and the report lane's, report_shards in all, are its own jobs of these numbers and then one
        # in each gate job once its gate tests end. Five test jobs a system, as GitHub runs five macOS jobs at once: there
        # one waits out the debug relay's minute, and the disk images wait for a test job to end.
        gate_shards: [2]
        report_shards: [5]
        shard: [1, 2, 3]
        exclude:
          - lane: gate
            shard: 3
        # time_scale multiplies every test's wall-clock limit, written as the Mac's time (PASSENGER_TEST_TIME_SCALE):
        # the 90th percentile, to the nearest half, of how much longer a test of 1 s or more took on the runner
        # (October: macOS 2.23, Windows 2.64, Linux 1.96). processes is how many test processes run a job's window and
        # Beside classes at once, its Alone classes after them in one: two on macOS (3 processors, 7 GB: two kept 1.4 GB
        # free, ending none) and Linux; three on Windows (4 processors, 16 GB: two ran each class 7% slower than one).
        include:
          - system: macOS
            name: macOS (arm64)
            os: macos-latest
            time_scale: 2
            processes: 2
            mobile_shards: '1 3'
          - system: Windows
            name: Windows (x64)
            os: windows-latest
            time_scale: 2.5
            processes: 3
            mobile_shards: ''
          - system: Linux
            name: Linux (x64)
            os: ubuntu-26.04
            time_scale: 2
            processes: 2
            mobile_shards: '1'
    # The report lane's shards on macOS that run the classes needing iOS's simulators and Mac Catalyst (mobile_shards)
    # are on the image with Xcode 27, whose SDKs .NET 11's iOS workload builds with; their minutes of set-up before the
    # tests (MOBILE) come on top of the others' 80.
    runs-on: ${{ matrix.system == 'macOS' && matrix.lane == 'report' && contains(format(' {0} ', matrix.mobile_shards), format(' {0} ', matrix.shard)) && 'xcode-27' || matrix.os }}
    timeout-minutes: ${{ matrix.lane == 'report' && contains(format(' {0} ', matrix.mobile_shards), format(' {0} ', matrix.shard)) && 95 || 80 }}
    env:
      LANE: ${{ matrix.lane }}
      SHARDS: ${{ matrix.lane == 'gate' && matrix.gate_shards || matrix.report_shards }}
      LABEL: ${{ matrix.lane == 'gate' && 'Gate' || 'Report' }}, ${{ matrix.name }}, shard ${{ matrix.shard }} of ${{ matrix.lane == 'gate' && matrix.gate_shards || matrix.report_shards }}
      # The job's tests' time, whichever lanes they are of.
      TEST_MINUTES: 60
      # Whether this job sets up what the report lane's classes needing a set-up of minutes need (test-shards.py's
      # SET_UPS): the mobile workloads and devices in the shards mobile_shards names, which run those classes last,
      # apart (two on macOS, whose simulator classes take about 30 minutes), and Aspire's runtime in Linux's second.
      # Windows sets up neither: no Android emulator runs on its runner, no iOS app builds there, and its real AppHosts
      # skip by design; macOS's report lane has no class of real AppHosts, none reaching macOS's own behaviour.
      MOBILE: ${{ matrix.lane == 'report' && contains(format(' {0} ', matrix.mobile_shards), format(' {0} ', matrix.shard)) }}
      ASPIRE: ${{ matrix.lane == 'report' && matrix.shard == 2 && matrix.system == 'Linux' }}
      # Aspire's dashboard and orchestrator, and the run's own aspire CLI, downloaded by the restore and named in the
      # tests' build (Passenger.Tests.csproj) where the job sets up for them.
      PassengerAspireRuntime: ${{ matrix.lane == 'report' && matrix.shard == 2 && matrix.system == 'Linux' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The SDK global.json names exactly, and .NET 10 for the debuggees and the tests' projects.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # macOS's runners of one label come as more than one machine (7 GB and 14 GB of memory, a job's tests taking a third
      # longer on the smaller), which the log names, so a job's time is read against the machine it had.
      - name: The runner's machine
        if: runner.os == 'macOS'
        run: sysctl hw.model machdep.cpu.brand_string hw.ncpu hw.memsize

      # The runner's .NET is in ~/.dotnet, not where the macOS installer puts it: registered, so the IDE started with
      # launchd's bare environment finds its runtime.
      - name: Register .NET's install location
        if: runner.os == 'macOS'
        run: sudo mkdir -p /etc/dotnet && echo "$DOTNET_ROOT" | sudo tee /etc/dotnet/install_location

      # createdump (a memory snapshot) reads its program as a debugger does, for which macOS asks a member of _developer
      # for a password that no one on a runner answers: the runner joins _developer, and the right asks its members
      # nothing. The state before is printed, for a hang that remains.
      - name: Let debugging tools read the runner's processes
        if: runner.os == 'macOS'
        run: |
          DevToolsSecurity -status
          id -Gn
          security authorizationdb read system.privilege.taskport | plutil -p -
          sudo dseditgroup -o edit -a "$USER" -t user _developer
          sudo dscacheutil -flushcache
          sudo security authorizationdb write system.privilege.taskport is-developer

      # The libraries a person installs (site/linux.html): Git, the window's X11 libraries, and fontconfig, which Skia
      # draws the headless tests' text with too.
      - name: The libraries Passenger needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git libx11-6 libice6 libsm6 libfontconfig1

      # The Vim that VimTests compares Vim mode with (tools/vim.sh), built from its release where the cache lacks it,
      # which the gate's first shard then fills; elsewhere its test skips, saying so.
      - name: Restore the tests' Vim
        if: runner.os == 'Linux'
        id: vim
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/vim
          key: vim-${{ hashFiles('tools/vim.sh') }}-${{ matrix.os }}-${{ runner.arch }}

      - name: Build the tests' Vim
        if: runner.os == 'Linux' && steps.vim.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libncurses-dev
          tools/vim.sh

      - name: Cache the tests' Vim
        if: runner.os == 'Linux' && matrix.lane == 'gate' && matrix.shard == 1 && steps.vim.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/vim
          key: ${{ steps.vim.outputs.cache-primary-key }}

      - name: Restore cached NuGet packages
        id: nuget
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      # Only what the lock files name, each package's content hash checked against them.
      - name: Restore
        run: dotnet restore --locked-mode

      # Saved once restored, so a failing build or test still leaves the next run its packages; by the gate's first
      # shard of each system, which every run has, since the others would only find the key taken.
      - name: Cache NuGet packages
        if: matrix.lane == 'gate' && matrix.shard == 1 && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}

      # .NET's mobile workloads at the workload set the tests are written for, MAUI's packages for each mobile platform
      # (tests/MauiGraphs) and the debug relays, which the build carries: on Linux Android's, on macOS iOS's and Mac
      # Catalyst's, with the Xcode the workload's iOS SDK names, whose simulators the tests boot themselves; and the JDK
      # the Android workload takes, as JAVA_HOME. What fails here only has the tests needing it skip, saying why.
      - name: The mobile workloads and the debug relays
        if: env.MOBILE == 'true'
        continue-on-error: true
        env:
          WORKLOADS: 11.0.100.1
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # Into the runner's .NET, which only root may write where the image put it there.
            dotnet workload install android maui-android --version "$WORKLOADS" \
              || sudo "$(command -v dotnet)" workload install android maui-android --version "$WORKLOADS"
            echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
            dotnet restore tests/MauiGraphs/Android
            tools/debug-relay.sh android
          else
            dotnet workload install android ios maccatalyst maui --version "$WORKLOADS"
            echo "JAVA_HOME=$JAVA_HOME_21_arm64" >> "$GITHUB_ENV"
            xcode=$(ls -d "$DOTNET_ROOT"/packs/Microsoft.iOS.Sdk.net11.0_* | tail -n 1)
            sudo xcode-select --switch "/Applications/Xcode_${xcode##*_}.app"
            xcodebuild -version
            xcrun simctl list runtimes
            dotnet restore tests/MauiGraphs/Android
            dotnet restore tests/MauiGraphs/iOS
            tools/debug-relay.sh apple
          fi

      # An emulator of Android 37 on Linux, KVM being the runner's own, started to boot while the solution builds, which
      # the Android tests run on (ANDROID_SERIAL); its AVD where ANDROID_AVD_HOME names, which avdmanager, the emulator
      # and the tests all read, as on the runner avdmanager otherwise writes where the emulator never looks.
      - name: An Android emulator
        if: env.MOBILE == 'true' && runner.os == 'Linux'
        continue-on-error: true
        env:
          IMAGE: system-images;android-37.0;default;x86_64
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools=$ANDROID_HOME/cmdline-tools/latest/bin
          export ANDROID_AVD_HOME=$RUNNER_TEMP/avd
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          { yes || true; } | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install emulator "$IMAGE" > /dev/null
          echo no | "$tools/avdmanager" create avd --force --name passenger --package "$IMAGE"
          nohup "$ANDROID_HOME/emulator/emulator" -avd passenger -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"

      # Azure Functions Core Tools 4, whose func runs the Functions app a real AppHost adds, on the PATH: its release's
      # archive, its SHA-256 checked against the one the release gives.
      - name: Azure Functions Core Tools
        if: env.ASPIRE == 'true'
        continue-on-error: true
        run: |
          case "$RUNNER_OS" in
            Linux) file=Azure.Functions.Cli.linux-x64.4.16.0.zip
              sum=c68c7780d94c7583157f7a7d1a05e0ec3e34057c3d55e4c7be71fc4aa0c23667 ;;
            macOS) file=Azure.Functions.Cli.osx-arm64.4.16.0.zip
              sum=5698d54038fd0507a614af53e8bd3f91c89f96e60ae081c113373b3d2af375f3 ;;
          esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/func.zip" "https://github.com/Azure/azure-functions-core-tools/releases/download/4.16.0/$file"
          echo "$sum  $RUNNER_TEMP/func.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/func.zip" -d "$RUNNER_TEMP/func"
          chmod +x "$RUNNER_TEMP/func/func"
          "$RUNNER_TEMP/func/func" --version
          echo "$RUNNER_TEMP/func" >> "$GITHUB_PATH"

      # The build's check, every analyzer and code-style rule with warnings as errors, is the gate's first shard's on
      # each system, which every run has; the others skip the analyzers (generators still run), which change nothing
      # built and take about half the build's time, and both deals give that job's shards less to run for it
      # (--checks-first). The compiler server and MSBuild nodes the build leaves end with it, handing the tests their
      # memory, which on a 7 GB runner a booted simulator, the language servers and the tests' own builds need.
      - name: Build
        env:
          CHECKS: ${{ matrix.lane == 'gate' && matrix.shard == 1 }}
        run: |
          if [ "$CHECKS" = true ]; then
            dotnet build --no-restore
          else
            dotnet build --no-restore -p:RunAnalyzers=false
          fi
          dotnet build-server shutdown || echo "Not every build server the build left could be ended"

      # Only Linux's runner runs Linux containers. The images the container tests run on (ContainerImages.txt; Docker
      # Hub limits pulls) come from a cache, pulled only when it lacks them, so no test pulls one.
      - name: Restore cached container images
        id: images
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-images.tar
          key: container-images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Passenger.Tests/ContainerImages.txt') }}

      # A pull that fails is a warning, not the shard's failure: the container tests skip, saying which image is missing.
      - name: The container images the tests run on
        id: pulled
        if: runner.os == 'Linux'
        env:
          IMAGES: ${{ runner.temp }}/container-images.tar
        run: |
          if [ -f "$IMAGES" ] && ! docker load -q -i "$IMAGES"; then
            echo "::warning title=Container images::The cached images did not load, so they are pulled"
            rm -f "$IMAGES"
          fi
          images=$(grep -v '^[[:space:]]*$' tests/Passenger.Tests/ContainerImages.txt)
          missing=
          for image in $images; do
            docker image inspect "$image" > /dev/null 2>&1 && continue
            docker pull -q "$image" || { echo "::warning title=Container image::$image could not be pulled, so the container tests skip"; missing=1; }
          done
          if [ -z "$missing" ] && [ ! -f "$IMAGES" ]; then
            docker save -o "$IMAGES" $images
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
          echo "PASSENGER_TEST_PULL=never" >> "$GITHUB_ENV"

      - name: Cache container images
        if: runner.os == 'Linux' && matrix.lane == 'gate' && matrix.shard == 1 && steps.images.outputs.cache-hit != 'true' && steps.pulled.outputs.saved == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-images.tar
          key: ${{ steps.images.outputs.cache-primary-key }}

      # A file the .gitignore matches never reaches a clone. After the build, so one that wrote beside the sources
      # shows too; and no tracked file may match a rule, since its folder's other files would not be seen.
      - name: No source is ignored by Git
        if: matrix.lane == 'gate' && matrix.shard == 1
        run: |
          hidden=$(git ls-files --others --ignored --exclude-standard -- src tests tools site
                   git ls-files --cached --ignored --exclude-standard)
          if [ -n "$hidden" ]; then
            echo "::error title=Ignored sources::The .gitignore matches these, so a clone would not have them or their neighbours"
            echo "$hidden"
            exit 1
          fi

      # Both lanes, the system's whole suite (whole.txt), as each lane's deal reads both: a class with tests outside its
      # lane that TestTimes.json has no seconds in the lane for is weighed by its share of them, and the report lane's
      # shards in the gate's jobs begin as the gate's tests end. The report lane lists [SameOnEverySystem] on Linux alone,
      # and on macOS only [AboutMacOS]. A listing naming no test or saying discovery failed (xunit #3576) is asked again,
      # up to three tries; the step fails where both lanes list more tests than the suite may (test-shards.py's MOST_TESTS).
      - name: List the tests
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          lists=artifacts/test-lists
          mkdir -p "$lists"
          "$python" -I tools/test-shards.py list "$lists/gate.txt" --lane gate --system "$SYSTEM"
          "$python" -I tools/test-shards.py list "$lists/report.txt" --lane report --system "$SYSTEM" \
            --beside "$lists/gate.txt"
          cat "$lists/gate.txt" "$lists/report.txt" > "$lists/whole.txt"

      # The deal goes in the log. Before any test runs, the lane's first shard alone lists what each shard's settings
      # select and fails unless every test of the lane is in exactly one (each listing costs a VSTest start). The
      # listings and the shards' settings go with the results, for the summary and `just test-times` to read.
      - name: Deal the gate's tests to its shards
        if: matrix.lane == 'gate'
        env:
          SYSTEM: ${{ matrix.system }}
          SHARD: ${{ matrix.shard }}
          PROCESSES: ${{ matrix.processes }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          results=artifacts/test-results
          mkdir -p "$results/shards"
          cp artifacts/test-lists/gate.txt "$results/suite.txt"
          cp artifacts/test-lists/whole.txt "$results/whole.txt"
          check=
          [ "$SHARD" != 1 ] || check=--check
          "$python" -I tools/test-shards.py split "$results/suite.txt" --lane gate --whole "$results/whole.txt" \
            --system "$SYSTEM" --of "$SHARDS" --processes "$PROCESSES" --checks-first --out "$results/shards" $check

      # The same for the report lane, whose last shards run each in a gate job once its gate tests end (as the gate's deal
      # has them end), numbered after the report jobs' own. Nothing of it fails a gate job.
      - name: Deal the report lane's tests to its shards
        id: report-deal
        if: inputs.report
        continue-on-error: ${{ matrix.lane == 'gate' }}
        env:
          SYSTEM: ${{ matrix.system }}
          NAME: ${{ matrix.name }}
          SHARD: ${{ matrix.shard }}
          GATE_SHARDS: ${{ matrix.gate_shards }}
          REPORT_SHARDS: ${{ matrix.report_shards }}
          PROCESSES: ${{ matrix.processes }}
          MOBILE_SHARDS: ${{ matrix.mobile_shards }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          results=artifacts/test-results
          number=$SHARD
          if [ "$LANE" = gate ]; then
            results=artifacts/report-results
            number=$((REPORT_SHARDS - GATE_SHARDS + SHARD))
          fi
          mkdir -p "$results/shards"
          cp artifacts/test-lists/report.txt "$results/suite.txt"
          cp artifacts/test-lists/whole.txt "$results/whole.txt"
          check=
          [ "$number" != 1 ] || check=--check
          apart=
          [ "$SYSTEM" = Windows ] || apart="--apart mobile --apart-shards $MOBILE_SHARDS --second aspire"
          "$python" -I tools/test-shards.py split "$results/suite.txt" --lane report --whole "$results/whole.txt" \
            --system "$SYSTEM" --of "$REPORT_SHARDS" --after artifacts/test-lists/gate.txt --after-of "$GATE_SHARDS" \
            --processes "$PROCESSES" --checks-first --out "$results/shards" $check $apart
          [ "$LANE" = gate ] || exit 0
          echo "shard=$number" >> "$GITHUB_OUTPUT"
          echo "label=Report, $NAME, shard $number of $REPORT_SHARDS, after the gate's shard $SHARD" >> "$GITHUB_OUTPUT"

      # Godot 4's .NET build at the version the Godot tests are written for, which the report lane's tests are given as
      # GODOT (the gate's are not): fetched from Godot's release, its SHA-512 checked against what Godot publishes for it,
      # and kept in the cache for the next run. A failure here only has the Godot tests skip, saying why.
      - name: Restore cached Godot
        id: godot-cache
        if: inputs.report
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot.zip
          key: godot-4.7.2-${{ runner.os }}

      - name: Godot
        id: godot
        if: inputs.report
        continue-on-error: true
        env:
          ZIP: ${{ runner.temp }}/godot.zip
          FOLDER: ${{ runner.temp }}/godot
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then
            # Paths both Git's bash and Windows' Python read.
            python=python ZIP=$(cygpath -m "$ZIP") FOLDER=$(cygpath -m "$FOLDER")
          fi
          case "$RUNNER_OS" in
            Linux) file=Godot_v4.7.2-stable_mono_linux_x86_64.zip program='*/Godot_v*_mono_linux.x86_64'
              sum=1855960b27ee3ef5e66e5e228cced69d55637b24334a7411162687dcd077d8f9f645348cdb8eae984bec8135d49ed855a1e3a16476786b8bce60774fd8402d13 ;;
            Windows) file=Godot_v4.7.2-stable_mono_win64.zip program='*/Godot_v*_mono_win64.exe'
              sum=79229fd112b0c9cbeab82363a4ef7be18ea70f1caf86bf912789335b136fbe7e01db0053a33461438c5da1c680c17bbb10040bd09bedc51221cd4423d0367757 ;;
            macOS) file=Godot_v4.7.2-stable_mono_macos.universal.zip program='*.app'
              sum=0862c53d7158c7a67f745e2e46f90b68cf5343cbe8b95d6d4333c469e42ca104af9c121d1746a50e5d221a99d09d82ef7016495f8e0d09255842884ed0502795 ;;
          esac
          [ -f "$ZIP" ] || curl -fsSL --retry 3 -o "$ZIP" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$file"
          "$python" -I -c 'import hashlib, sys; seen = hashlib.sha512(open(sys.argv[1], "rb").read()).hexdigest(); sys.exit(None if seen == sys.argv[2] else f"{sys.argv[3]} has the SHA-512 {seen}, not the release one")' "$ZIP" "$sum" "$file"
          echo "saved=true" >> "$GITHUB_OUTPUT"
          # ditto keeps the app bundle as signed; Python reads a zip the same on Linux and Windows.
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -x -k "$ZIP" "$FOLDER"
          else
            "$python" -I -m zipfile -e "$ZIP" "$FOLDER"
          fi
          godot=$("$python" -I -c 'import glob, os, sys; print(glob.glob(os.path.join(sys.argv[1], sys.argv[2]))[0])' "$FOLDER" "$program")
          [ "$RUNNER_OS" != Linux ] || chmod +x "$godot"
          echo "path=$godot" >> "$GITHUB_OUTPUT"

      - name: Cache Godot
        if: inputs.report && matrix.lane == 'gate' && matrix.shard == 1 && steps.godot-cache.outputs.cache-hit != 'true' && steps.godot.outputs.saved == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/godot.zip
          key: ${{ steps.godot-cache.outputs.cache-primary-key }}

      # The emulator started before the build, booted (sys.boot_completed) before the tests; one that never boots leaves
      # the Android tests to start it themselves.
      - name: Wait for the Android emulator
        if: env.MOBILE == 'true' && runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          adb=$ANDROID_HOME/platform-tools/adb
          for _ in $(seq 120); do
            if [ "$("$adb" -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; then
              "$adb" devices -l
              exit 0
            fi
            sleep 5
          done
          echo "::warning title=Android emulator::It did not boot in 10 minutes, so the Android tests start it themselves"
          tail -n 50 "$RUNNER_TEMP/emulator.log"
          exit 1

      # A job's tests have TEST_MINUTES in all: a gate job's report shard has what its gate tests left.
      - name: Start the clock on the job's tests
        if: matrix.lane == 'gate' && steps.report-deal.outcome == 'success'
        run: echo "TESTS_BEGAN=$(date +%s)" >> "$GITHUB_ENV"

      # The hand's runs of dotnet test as the deal wrote them (with several processes, the window and Beside classes in
      # them at once, then the Alone classes in one), what each prints kept beside the results as it comes, so a shard stopped
      # partway leaves what it ran. A test hung for 10 minutes is stopped and named, rather than holding the job to its
      # timeout, and what it left is kept in the results' hangs/: the report the test host writes a minute before (the
      # tests running, what the IDE stood on, its log's end, the threads of each .NET program under it), and blame's mini
      # dumps of the test host and the programs under it, but on macOS, where blame dumps each whole (about 7 GB) and the
      # host ends itself once its report is written. Each class's time and how low the free memory fell go in the job's
      # summary; the failed tests are listed last, as annotations (warnings in the report lane) and in the job's summary.
      - name: Test
        shell: pwsh
        timeout-minutes: ${{ fromJSON(env.TEST_MINUTES) }}
        continue-on-error: ${{ matrix.lane == 'report' }}
        env:
          RESULTS: artifacts/test-results
          SHARD: ${{ matrix.shard }}
          PASSENGER_TEST_TIME_SCALE: ${{ matrix.time_scale }}
          GODOT: ${{ matrix.lane == 'report' && steps.godot.outputs.path || '' }}
          # On macOS a mobile shard boots the iOS tests' simulator once and shuts it down again, after its other classes
          # and before its classes apart (tools/simulator-first-boot.sh): the runner's first boot of it and the minutes
          # of setting up after that take no test's time, and no window class runs beside what a booted simulator leaves.
          FIRST_BOOT: ${{ env.MOBILE == 'true' && runner.os == 'macOS' }}
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          $before = @()
          if ($env:FIRST_BOOT -eq 'true') { $before = '--before-apart', 'tools/simulator-first-boot.sh' }
          & $python -I tools/test-shards.py test $env:RESULTS --shard $env:SHARD --lane $env:LANE --label $env:LABEL @before
          exit $LASTEXITCODE

      # Which shard this was and how its job ended, beside its results, for the summary jobs; what a hang left in hangs/,
      # its report printed whole and the tests it was running named in the job's summary; and the classes of its hand it
      # did not run whole (its Test step ran out of time, or a test host ended), each a line "  Unreached CLASS" in the
      # log, in the job's summary and in unreached.txt.
      - name: Say how the shard ended
        if: ${{ !cancelled() }}
        env:
          RESULTS: artifacts/test-results
          SYSTEM: ${{ matrix.system }}
          SHARD: ${{ matrix.shard }}
          STATUS: ${{ job.status }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          "$python" -I tools/test-shards.py ended "$RESULTS" --system "$SYSTEM" --lane "$LANE" --shard "$SHARD" \
            --of "$SHARDS" --status "$STATUS" --label "$LABEL"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.system }}-${{ matrix.lane }}-${{ matrix.shard }}
          path: artifacts/test-results/

      # A gate job's report shard, once the gate's results are kept, whether its gate tests passed or not, in the minutes
      # they left: as in a report job, its failed tests are warnings and its results the report lane's, and nothing of it
      # fails the job, whose verdict is the gate's alone.
      - name: The report shard's minutes
        id: minutes
        if: ${{ !cancelled() && matrix.lane == 'gate' && steps.report-deal.outcome == 'success' }}
        continue-on-error: true
        run: echo "left=$(( TEST_MINUTES - ($(date +%s) - TESTS_BEGAN + 59) / 60 ))" >> "$GITHUB_OUTPUT"

      - name: Test the report shard
        id: report-test
        if: ${{ !cancelled() && matrix.lane == 'gate' && fromJSON(steps.minutes.outputs.left || '0') > 0 }}
        shell: pwsh
        timeout-minutes: ${{ fromJSON(steps.minutes.outputs.left || '1') }}
        continue-on-error: true
        env:
          RESULTS: artifacts/report-results
          LANE: report
          SHARD: ${{ steps.report-deal.outputs.shard }}
          LABEL: ${{ steps.report-deal.outputs.label }}
          PASSENGER_TEST_TIME_SCALE: ${{ matrix.time_scale }}
          GODOT: ${{ steps.godot.outputs.path }}
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -I tools/test-shards.py test $env:RESULTS --shard $env:SHARD --lane $env:LANE --label $env:LABEL
          exit $LASTEXITCODE

      # Its status is its Test step's conclusion, as a report job's is its job's: success however its tests went or ran
      # out of time, skipped when its gate tests left it no minute.
      - name: Say how the report shard ended
        if: ${{ !cancelled() && matrix.lane == 'gate' && steps.report-deal.outcome == 'success' }}
        continue-on-error: true
        env:
          RESULTS: artifacts/report-results
          SYSTEM: ${{ matrix.system }}
          LANE: report
          SHARD: ${{ steps.report-deal.outputs.shard }}
          SHARDS: ${{ matrix.report_shards }}
          LABEL: ${{ steps.report-deal.outputs.label }}
          STATUS: ${{ steps.report-test.conclusion }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          "$python" -I tools/test-shards.py ended "$RESULTS" --system "$SYSTEM" --lane "$LANE" --shard "$SHARD" \
            --of "$SHARDS" --status "$STATUS" --label "$LABEL"

      - name: Upload the report shard's results
        if: ${{ !cancelled() && matrix.lane == 'gate' && steps.report-deal.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.system }}-report-${{ steps.report-deal.outputs.shard }}
          path: artifacts/report-results/

  # Each lane's result on each system as one check: every shard's job succeeded and every test of the lane has exactly
  # one result among them, each class's time in the summary, and a warning when dealing by this run's times would end
  # the slowest shard two minutes sooner (`just test-times RUN` writes them, for a person to commit). The report lane's
  # only warns. It waits for every shard, as one matrix job's needs must.
  summary:
    name: ${{ matrix.lane == 'gate' && 'Gate' || 'Report' }}, ${{ matrix.name }}
    needs: shard
    if: ${{ !cancelled() }}
    continue-on-error: ${{ matrix.lane == 'report' }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.report && '["gate", "report"]' || '["gate"]') }}
        system: [macOS, Windows, Linux]
        include:
          - system: macOS
            name: macOS (arm64)
          - system: Windows
            name: Windows (x64)
          - system: Linux
            name: Linux (x64)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            tests/Passenger.Tests

      # Each shard's artifact in a folder of its own, or, when only one shard left any, in results itself.
      - name: Download the shards' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-${{ matrix.system }}-${{ matrix.lane }}-*
          path: results

      - name: Test times
        env:
          NAME: ${{ matrix.name }}, the ${{ matrix.lane }} lane
        run: |
          if [ -n "$(find results -name '*.trx' 2> /dev/null)" ]; then
            python3 -I tools/test-times.py results --label "$NAME"
          fi

      - name: Every test ran in exactly one shard
        if: ${{ !cancelled() }}
        env:
          SYSTEM: ${{ matrix.system }}
          LANE: ${{ matrix.lane }}
        run: python3 -I tools/test-shards.py cover results --system "$SYSTEM" --lane "$LANE"

  # The report lane's failed tests on every system in one table, its shards in the gate's jobs too, each with its system
  # and the first line of what it said, to be filed and fixed in the usual way: nothing here fails the run.
  failures:
    name: Report's failed tests
    needs: shard
    if: ${{ inputs.report && !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools

      - name: Download the report shards' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*-report-*
          path: results

      - name: The failed tests
        run: python3 -I tools/test-shards.py failures results --title "The report lane's failed tests"
